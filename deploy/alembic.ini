# =============================================================================
# Bezalel.AI — Alembic Configuration
#
# Database migration tool for SQLAlchemy.
# Place this file in the backend directory (/data/bezalel/backend/).
# =============================================================================

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with the project directory so imports work
prepend_sys_path = .

# Timezone for migration timestamps
timezone = US/Eastern

# Database URL — overridden at runtime by env.py to use the async URL from
# the application config. This fallback is only used if env.py does not
# set the URL programmatically.
sqlalchemy.url = postgresql://bezalel:bezalel@localhost:5432/bezalel

[post_write_hooks]
# No hooks configured

# ── Logging ─────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
