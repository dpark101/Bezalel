# =============================================================================
# Bezalel.AI — Nginx Configuration
# Domain: www.danieltaehyunpark.com
# Proxies Next.js (port 3000) and FastAPI (port 8000) behind Cloudflare.
# =============================================================================

# ── Rate-limiting zones ─────────────────────────────────────────────────────
# Login endpoints: 5 requests/minute per client IP
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# API endpoints: 60 requests/minute (1 req/s) per client IP
limit_req_zone $binary_remote_addr zone=api:10m rate=1r/s;

# General traffic: 120 requests/minute (2 req/s) per client IP
limit_req_zone $binary_remote_addr zone=general:10m rate=2r/s;

# ── Upstream definitions ────────────────────────────────────────────────────
upstream nextjs_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.danieltaehyunpark.com danieltaehyunpark.com;

    # Allow Cloudflare IPs only
    include /etc/nginx/snippets/cloudflare_ips.conf;

    return 301 https://www.danieltaehyunpark.com$request_uri;
}

# ── Main HTTPS server ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.danieltaehyunpark.com;

    # ── SSL certificates (Let's Encrypt via Certbot) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/www.danieltaehyunpark.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.danieltaehyunpark.com/privkey.pem;

    # ── TLS hardening ───────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/www.danieltaehyunpark.com/chain.pem;

    # ── Only accept connections from Cloudflare ─────────────────────────────
    include /etc/nginx/snippets/cloudflare_ips.conf;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Client body size (CSV uploads up to 10MB) ───────────────────────────
    client_max_body_size 10M;

    # ── Proxy: FastAPI backend (/api/) ──────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for long-running AI requests
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Rate-limited login endpoint ─────────────────────────────────────────
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Proxy: Next.js frontend (everything else) ───────────────────────────
    location / {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── WebSocket support (Next.js hot-reload in dev) ───────────────────────
    location /_next/webpack-hmr {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ── Next.js static assets (long cache) ──────────────────────────────────
    location /_next/static/ {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Deny access to hidden files ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
